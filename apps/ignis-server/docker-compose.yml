services:
  ignis:
    build:
      context: ../..
      dockerfile: apps/ignis-server/Dockerfile
    ports:
      - "8082:8080"
    environment:
      - OBSIDIAN_VERSION=1.13.7
    volumes:
      - ./vaults:/vaults
      - ./data:/app/data
      - obsidian-app:/app/obsidian-app
    restart: unless-stopped

volumes:
  obsidian-app:
